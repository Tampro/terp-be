# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${ATTENDANCE_PORT:8084}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        acknowledge-mode: auto
        # Retention events (erp-common RetentionConsumerConfig): retried in-process, then dead-lettered.
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 3
          max-interval: 60s
  application:
    name: attendance-service
  datasource:
    url: ${ATTENDANCE_DB_URL:jdbc:mysql://localhost:3306/erp_attendance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ATTENDANCE_DB_USERNAME}
    password: ${ATTENDANCE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      # Import files only.
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  # Retention (PO 2026-11-24): 5 years after the company was deleted.
  # iam.company.anonymize → AttendanceAnonymizer.
  retention:
    queue: ${ERP_RETENTION_QUEUE:erp.attendance.retention}
  jobs:
    lock:
      enabled: ${ERP_JOBS_LOCK_ENABLED:true}
  attendance:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    employee-service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8083}
    media-service-url: ${MEDIA_SERVICE_URL:http://localhost:8082}
    # Biometric device endpoint (no token): per device key, and wrong keys per client IP.
    device-rate-limit:
      per-minute: ${DEVICE_RATE_PER_MINUTE:120}
      burst: ${DEVICE_RATE_BURST:30}
      failed-per-minute: ${DEVICE_RATE_FAILED_PER_MINUTE:10}
      # true only behind the gateway (compose): the client IP is then the last X-Forwarded-For entry.
      trust-forwarded-for: ${DEVICE_RATE_TRUST_FORWARDED_FOR:false}
    # Forgotten clock-outs closed at the shift end, once the end + after-end-minutes has passed.
    auto-clock-out:
      enabled: ${ATTENDANCE_AUTO_CLOCK_OUT_ENABLED:true}
      cron: ${ATTENDANCE_AUTO_CLOCK_OUT_CRON:0 */15 * * * *}
      after-end-minutes: ${ATTENDANCE_AUTO_CLOCK_OUT_AFTER_END_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
