# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${MEETING_PORT:8088}

spring:
  application:
    name: meeting-service
  datasource:
    url: ${MEETING_DB_URL:jdbc:mysql://localhost:3306/erp_meeting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MEETING_DB_USERNAME}
    password: ${MEETING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  meeting:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    employee-service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8083}
    # AES-256 key (base64 of 32 bytes) for the Zoom client secrets; a secret, so no default.
    enc-key: ${MEETING_ENC_KEY}
    zoom:
      oauth-url: ${ZOOM_OAUTH_URL:https://zoom.us/oauth/token}
      api-url: ${ZOOM_API_URL:https://api.zoom.us/v2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
