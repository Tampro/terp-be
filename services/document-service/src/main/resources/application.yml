# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${DOCUMENT_PORT:8089}

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        acknowledge-mode: auto
        # Retention events (erp-common RetentionConsumerConfig): retried in-process, then dead-lettered.
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 3
          max-interval: 60s
  application:
    name: document-service
  datasource:
    url: ${DOCUMENT_DB_URL:jdbc:mysql://localhost:3306/erp_document?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DOCUMENT_DB_USERNAME}
    password: ${DOCUMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  # Retention (PO 2026-11-24): 5 years after the company was deleted.
  # iam.company.anonymize → DocumentAnonymizer.
  retention:
    queue: ${ERP_RETENTION_QUEUE:erp.document.retention}
  document:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    employee-service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8083}
    media-service-url: ${MEDIA_SERVICE_URL:http://localhost:8082}
    # Keycloak service account (client credentials): download links of HR documents for callers without MEDIA_VIEW.
    service-account:
      token-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/token
      client-id: ${DOCUMENT_SERVICE_CLIENT_ID:erp-document-service}
      # Secret: no default.
      client-secret: ${DOCUMENT_SERVICE_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
