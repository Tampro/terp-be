# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${DELIVERY_PORT:8101}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  application:
    name: delivery-service
  datasource:
    url: ${DELIVERY_DB_URL:jdbc:mysql://localhost:3306/erp_delivery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DELIVERY_DB_USERNAME}
    password: ${DELIVERY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 5s
    # The outbox relay waits for each confirm (RabbitOutboxSender.waitForConfirmsOrDie).
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        # A message whose intake keeps failing is retried in-process, then dead-lettered (erp.delivery.orders.dlq).
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 3
          max-interval: 60s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  # Transactional outbox (erp-common com.terp.erp.outbox): delivery.status.changed is written with the status change.
  outbox:
    enabled: ${ERP_OUTBOX_ENABLED:true}
    exchange: ${ERP_OUTBOX_EXCHANGE:erp.events}
    batch-size: ${ERP_OUTBOX_BATCH_SIZE:20}
    poll-interval-ms: ${ERP_OUTBOX_POLL_INTERVAL_MS:2000}
    max-attempts: ${ERP_OUTBOX_MAX_ATTEMPTS:10}
    initial-backoff: ${ERP_OUTBOX_INITIAL_BACKOFF:5s}
    max-backoff: ${ERP_OUTBOX_MAX_BACKOFF:10m}
    confirm-timeout: ${ERP_OUTBOX_CONFIRM_TIMEOUT:5s}
  delivery:
    orders-queue: ${DELIVERY_ORDERS_QUEUE:erp.delivery.orders}
    orders-dead-letter-queue: ${DELIVERY_ORDERS_DLQ:erp.delivery.orders.dlq}
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8100}
    # Keycloak service account of delivery-service (client credentials): order-service / IAM /api/v1/internal/**.
    service-account:
      token-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/token
      client-id: ${DELIVERY_SERVICE_CLIENT_ID:erp-delivery-service}
      client-secret: ${DELIVERY_SERVICE_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
