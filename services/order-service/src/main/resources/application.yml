# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${ORDER_PORT:8100}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://localhost:3306/erp_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 5s
    # The outbox relay waits for each confirm (RabbitOutboxSender.waitForConfirmsOrDie).
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        # A message whose intake keeps failing is retried in-process, then dead-lettered (erp.order.accounting.dlq).
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 3
          max-interval: 60s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  # Scheduled jobs (CartCleanupJob) lock through ShedLock: one instance runs them.
  jobs:
    lock:
      enabled: ${ERP_JOBS_LOCK_ENABLED:true}
  # Transactional outbox (erp-common com.terp.erp.outbox): the SHOP_ORDER journal request is written with the PAID
  # status and relayed to the erp.events exchange.
  outbox:
    enabled: ${ERP_OUTBOX_ENABLED:true}
    exchange: ${ERP_OUTBOX_EXCHANGE:erp.events}
    batch-size: ${ERP_OUTBOX_BATCH_SIZE:20}
    poll-interval-ms: ${ERP_OUTBOX_POLL_INTERVAL_MS:2000}
    max-attempts: ${ERP_OUTBOX_MAX_ATTEMPTS:10}
    initial-backoff: ${ERP_OUTBOX_INITIAL_BACKOFF:5s}
    max-backoff: ${ERP_OUTBOX_MAX_BACKOFF:10m}
    confirm-timeout: ${ERP_OUTBOX_CONFIRM_TIMEOUT:5s}
  order:
    # Service accounts allowed on /api/v1/internal/** (delivery-service: the order behind a delivery;
    # notification-service: who to email about an order).
    internal:
      client-ids: ${ORDER_INTERNAL_CLIENT_IDS:erp-delivery-service,erp-notification-service}
    accounting-queue: ${ORDER_ACCOUNTING_QUEUE:erp.order.accounting}
    accounting-dead-letter-queue: ${ORDER_ACCOUNTING_DLQ:erp.order.accounting.dlq}
    delivery-queue: ${ORDER_DELIVERY_QUEUE:erp.order.delivery}
    delivery-dead-letter-queue: ${ORDER_DELIVERY_DLQ:erp.order.delivery.dlq}
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    member-service-url: ${MEMBER_SERVICE_URL:http://localhost:8099}
    store-service-url: ${STORE_SERVICE_URL:http://localhost:8098}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8091}
    delivery-service-url: ${DELIVERY_SERVICE_URL:http://localhost:8101}
    customer-jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/erp-customer/protocol/openid-connect/certs
    customer-issuer: ${KEYCLOAK_CUSTOMER_ISSUER:http://localhost:8180/realms/erp-customer}
    # AES-256-GCM key of the delivery phone kept on orders (base64 of 32 bytes, FieldCipher). No default.
    enc-key: ${ORDER_ENC_KEY}
    # Internal sandbox payment (no real PG yet, P3): POST …/orders/{no}/pay {outcome}. Off in production.
    payment-sandbox: ${ORDER_PAYMENT_SANDBOX:true}
    # Keycloak service account of order-service (client credentials): member / store / inventory /api/v1/internal/**.
    service-account:
      token-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/token
      client-id: ${ORDER_SERVICE_CLIENT_ID:erp-order-service}
      client-secret: ${ORDER_SERVICE_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
