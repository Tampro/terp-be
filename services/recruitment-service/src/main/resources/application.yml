# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${RECRUITMENT_PORT:8085}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  application:
    name: recruitment-service
  datasource:
    url: ${RECRUITMENT_DB_URL:jdbc:mysql://localhost:3306/erp_recruitment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${RECRUITMENT_DB_USERNAME}
    password: ${RECRUITMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      # Resumes and cover letters: 5 MB each (checked by the service with a message).
      max-file-size: 6MB
      max-request-size: 12MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 5s
    # The outbox relay waits for each confirm (RabbitOutboxSender.waitForConfirmsOrDie).
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        # Retention events (erp-common RetentionConsumerConfig): retried in-process, then dead-lettered.
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 3
          max-interval: 60s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  jobs:
    lock:
      enabled: ${ERP_JOBS_LOCK_ENABLED:true}
  # Retention (PO 2026-11-24): iam.company.anonymize → RecruitmentAnonymizer.
  retention:
    queue: ${ERP_RETENTION_QUEUE:erp.recruitment.retention}
  # Transactional outbox (erp-common com.terp.erp.outbox): events are written with the business change and
  # relayed to the erp.events exchange. Off = no relay, and the services that publish fail to start.
  outbox:
    enabled: ${ERP_OUTBOX_ENABLED:true}
    exchange: ${ERP_OUTBOX_EXCHANGE:erp.events}
    batch-size: ${ERP_OUTBOX_BATCH_SIZE:20}
    poll-interval-ms: ${ERP_OUTBOX_POLL_INTERVAL_MS:2000}
    max-attempts: ${ERP_OUTBOX_MAX_ATTEMPTS:10}
    initial-backoff: ${ERP_OUTBOX_INITIAL_BACKOFF:5s}
    max-backoff: ${ERP_OUTBOX_MAX_BACKOFF:10m}
    confirm-timeout: ${ERP_OUTBOX_CONFIRM_TIMEOUT:5s}
  recruitment:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    employee-service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8083}
    storage-dir: ${RECRUITMENT_STORAGE_DIR:./recruitment-data}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
