# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${SUPPORT_PORT:8096}

spring:
  application:
    name: support-service
  datasource:
    url: ${SUPPORT_DB_URL:jdbc:mysql://localhost:3306/erp_support?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SUPPORT_DB_USERNAME}
    password: ${SUPPORT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      # CSV import of knowledge base articles / FAQs; the service caps the file itself (CsvImport.MAX_BYTES).
      max-file-size: 2MB
      max-request-size: 3MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  support:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    media-service-url: ${MEDIA_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
