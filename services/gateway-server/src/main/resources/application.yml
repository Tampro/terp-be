server:
  port: ${GATEWAY_PORT:8080}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  application:
    name: gateway-server
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins: ${ERP_CORS_ORIGINS:http://localhost:5173}
                allowed-methods: GET,POST,PUT,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Accept-Language,X-Act-As-Company
                exposed-headers: X-Trace-Id,Content-Disposition
          # Each service sets its own CORS headers too; keep only the gateway's.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/me/**,/api/v1/me,/api/v1/iam/**,/api/v1/helpdesk/**,/api/v1/saas/**,/api/v1/settings/**,/api/v1/languages,/api/v1/languages/**,/api/v1/public/site/**,/api/v1/public/payments/**
            - id: media-service
              uri: ${MEDIA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/media/**
            - id: employee-service
              uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/employees/**,/api/v1/employees,/api/v1/org/**,/api/v1/lifecycle/**,/api/v1/performance/**,/api/v1/training/**
            - id: attendance-service
              uri: ${ATTENDANCE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/attendance/**
            - id: recruitment-service
              uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/recruitment/**,/api/v1/public/career/**
            - id: payroll-service
              uri: ${PAYROLL_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/payroll/**
            - id: asset-service
              uri: ${ASSET_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/asset/**
            - id: meeting-service
              uri: ${MEETING_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/meeting/**
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/document/**
            - id: report-service
              uri: ${REPORT_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/reports/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/inventory/**
            - id: commerce-service
              uri: ${COMMERCE_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/v1/sales/**,/api/v1/purchase/**,/api/v1/pos/**,/api/v1/portal/client/invoices/**,/api/v1/portal/client/invoices,/api/v1/portal/client/returns/**,/api/v1/portal/client/returns,/api/v1/portal/client/proposals/**,/api/v1/portal/client/proposals,/api/v1/portal/client/quotations/**,/api/v1/portal/client/quotations,/api/v1/portal/vendor/purchase-invoices/**,/api/v1/portal/vendor/purchase-invoices,/api/v1/portal/vendor/purchase-returns/**,/api/v1/portal/vendor/purchase-returns
            - id: accounting-service
              uri: ${ACCOUNTING_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/v1/accounting/**,/api/v1/portal/client/payments/**,/api/v1/portal/client/payments,/api/v1/portal/client/credit-notes/**,/api/v1/portal/client/credit-notes,/api/v1/portal/vendor/payments/**,/api/v1/portal/vendor/payments,/api/v1/portal/vendor/debit-notes/**,/api/v1/portal/vendor/debit-notes
            - id: crm-service
              uri: ${CRM_SERVICE_URL:http://localhost:8094}
              predicates:
                - Path=/api/v1/crm/**,/api/v1/portal/client/contracts/**,/api/v1/portal/client/contracts,/api/v1/portal/client/deals/**,/api/v1/portal/client/deals
            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:8095}
              predicates:
                - Path=/api/v1/projects/**,/api/v1/forms/**,/api/v1/public/forms/**,/api/v1/portal/client/projects/**,/api/v1/portal/client/projects
            - id: support-service
              uri: ${SUPPORT_SERVICE_URL:http://localhost:8096}
              predicates:
                - Path=/api/v1/support/**,/api/v1/messenger/**,/api/v1/public/support/**,/api/v1/portal/client/tickets/**,/api/v1/portal/client/tickets
            # SSE stream: must come before notification-service (first match wins). response-timeout -1 lifts the
            # global 15s read timeout for this path only; the service ends the stream at the token's expiry.
            - id: notification-stream
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8097}
              predicates:
                - Path=/api/v1/notifications/me/stream
              metadata:
                response-timeout: -1
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8097}
              predicates:
                - Path=/api/v1/notifications/**
            - id: store-service
              uri: ${STORE_SERVICE_URL:http://localhost:8098}
              predicates:
                - Path=/api/v1/store/**,/api/v1/public/shop/**
            # Customer API (realm erp-customer only, GatewaySecurityConfig.shopFilterChain). Carts first: the first
            # matching route wins and /api/v1/shop/** below goes to member-service.
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/api/v1/shop/*/stores/*/cart,/api/v1/shop/*/stores/*/cart/**,/api/v1/shop/*/stores/*/orders,/api/v1/shop/*/orders,/api/v1/shop/*/orders/**
            # Back Office orders (staff realm, ORDER_VIEW).
            - id: order-staff
              uri: ${ORDER_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/api/v1/order/**
            - id: member-service
              uri: ${MEMBER_SERVICE_URL:http://localhost:8099}
              predicates:
                - Path=/api/v1/shop/**

springdoc:
  api-docs:
    enabled: ${ERP_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${ERP_SWAGGER_ENABLED:true}
    # Each entry is proxied by SwaggerDocsRoutes to that service's /v3/api-docs.
    urls:
      - { name: iam-service, url: /docs/iam/v3/api-docs }
      - { name: media-service, url: /docs/media/v3/api-docs }
      - { name: employee-service, url: /docs/employee/v3/api-docs }
      - { name: attendance-service, url: /docs/attendance/v3/api-docs }
      - { name: recruitment-service, url: /docs/recruitment/v3/api-docs }
      - { name: payroll-service, url: /docs/payroll/v3/api-docs }
      - { name: asset-service, url: /docs/asset/v3/api-docs }
      - { name: meeting-service, url: /docs/meeting/v3/api-docs }
      - { name: document-service, url: /docs/document/v3/api-docs }
      - { name: report-service, url: /docs/report/v3/api-docs }
      - { name: inventory-service, url: /docs/inventory/v3/api-docs }
      - { name: commerce-service, url: /docs/commerce/v3/api-docs }
      - { name: accounting-service, url: /docs/accounting/v3/api-docs }
      - { name: crm-service, url: /docs/crm/v3/api-docs }
      - { name: project-service, url: /docs/project/v3/api-docs }
      - { name: support-service, url: /docs/support/v3/api-docs }
      - { name: notification-service, url: /docs/notification/v3/api-docs }
      - { name: store-service, url: /docs/store/v3/api-docs }
      - { name: member-service, url: /docs/member/v3/api-docs }
      - { name: order-service, url: /docs/order/v3/api-docs }

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

erp:
  swagger:
    # Public API docs through the gateway; set false in production.
    enabled: ${ERP_SWAGGER_ENABLED:true}
  gateway:
    # Customer realm erp-customer (ADR-001): the only issuer accepted on /api/v1/shop/**.
    customer:
      jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/erp-customer/protocol/openid-connect/certs
      issuer: ${KEYCLOAK_CUSTOMER_ISSUER:http://localhost:8180/realms/erp-customer}
    # The biometric device endpoint is the only one reachable without a token: limit it per client IP.
    device-rate-limit:
      per-minute: ${GATEWAY_DEVICE_RATE_PER_MINUTE:60}
      burst: ${GATEWAY_DEVICE_RATE_BURST:20}
    # Public career page (no token): reads and applications limited per client IP, applications much tighter.
    career-rate-limit:
      read-per-minute: ${GATEWAY_CAREER_READ_PER_MINUTE:120}
      read-burst: ${GATEWAY_CAREER_READ_BURST:40}
      apply-per-minute: ${GATEWAY_CAREER_APPLY_PER_MINUTE:10}
      apply-burst: ${GATEWAY_CAREER_APPLY_BURST:5}
    # Public form link (no token): reads and submitted responses limited per client IP.
    form-rate-limit:
      read-per-minute: ${GATEWAY_FORM_READ_PER_MINUTE:120}
      read-burst: ${GATEWAY_FORM_READ_BURST:40}
      apply-per-minute: ${GATEWAY_FORM_SUBMIT_PER_MINUTE:10}
      apply-burst: ${GATEWAY_FORM_SUBMIT_BURST:5}
    # Public support portal (no token): reads limited per client IP; ticket create / track / reply and the contact
    # form share a much tighter bucket (each stores a row, and track must not allow guessing ticket number + email).
    support-rate-limit:
      read-per-minute: ${GATEWAY_SUPPORT_READ_PER_MINUTE:120}
      read-burst: ${GATEWAY_SUPPORT_READ_BURST:40}
      write-per-minute: ${GATEWAY_SUPPORT_WRITE_PER_MINUTE:10}
      write-burst: ${GATEWAY_SUPPORT_WRITE_BURST:5}
    # Public storefront (no token, reads only): per client IP; a customer browsing a catalogue reads more than a portal.
    shop-rate-limit:
      read-per-minute: ${GATEWAY_SHOP_READ_PER_MINUTE:240}
      read-burst: ${GATEWAY_SHOP_READ_BURST:60}
