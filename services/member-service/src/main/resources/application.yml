# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${MEMBER_PORT:8099}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  application:
    name: member-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        acknowledge-mode: auto
        # Retention events (erp-common RetentionConsumerConfig): retried in-process, then dead-lettered.
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 3
          max-interval: 60s
  datasource:
    url: ${MEMBER_DB_URL:jdbc:mysql://localhost:3306/erp_member?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MEMBER_DB_USERNAME}
    password: ${MEMBER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

# RabbitMQ only to consume retention events (MemberAnonymizer); no outbox (erp.outbox.enabled unset = off).
erp:
  retention:
    queue: ${ERP_RETENTION_QUEUE:erp.member.retention}
  member:
    # Service accounts allowed on /api/v1/internal/** (order-service: the membership behind a cart).
    internal:
      client-ids: ${MEMBER_INTERNAL_CLIENT_IDS:erp-order-service}
    # AES-256-GCM key of the delivery address phone (base64 of 32 bytes, FieldCipher). No default.
    enc-key: ${MEMBER_ENC_KEY}
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    store-service-url: ${STORE_SERVICE_URL:http://localhost:8098}
    customer-jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/erp-customer/protocol/openid-connect/certs
    customer-issuer: ${KEYCLOAK_CUSTOMER_ISSUER:http://localhost:8180/realms/erp-customer}
    # Keycloak service account of member-service (client credentials): reads store-service's /api/v1/internal/**.
    service-account:
      token-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/token
      client-id: ${MEMBER_SERVICE_CLIENT_ID:erp-member-service}
      client-secret: ${MEMBER_SERVICE_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
