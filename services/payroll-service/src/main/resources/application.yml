# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${PAYROLL_PORT:8086}

spring:
  application:
    name: payroll-service
  datasource:
    url: ${PAYROLL_DB_URL:jdbc:mysql://localhost:3306/erp_payroll?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PAYROLL_DB_USERNAME}
    password: ${PAYROLL_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  servlet:
    multipart:
      # Import files only.
      max-file-size: 5MB
      max-request-size: 6MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  payroll:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    employee-service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8083}
    attendance-service-url: ${ATTENDANCE_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
