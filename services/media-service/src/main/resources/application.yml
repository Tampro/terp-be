# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${MEDIA_PORT:8082}

spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL:jdbc:mysql://localhost:3306/erp_media?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MEDIA_DB_USERNAME}
    password: ${MEDIA_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      # Per-file limit is enforced by the service (MEDIA_005, with a message); these only cap the request.
      max-file-size: ${MEDIA_MAX_FILE_SIZE:10MB}
      max-request-size: 60MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  media:
    storage-dir: ${MEDIA_STORAGE_DIR:./media-data}
    link-secret: ${MEDIA_LINK_SECRET}
    link-ttl: ${MEDIA_LINK_TTL:PT10M}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:10MB}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    # Service accounts allowed on /api/v1/internal/** (employee-service: announcement attachments;
    # document-service: HR document downloads), comma-separated.
    internal-client-ids: ${MEDIA_INTERNAL_CLIENT_IDS:erp-employee-service,erp-document-service}
    # S3-compatible storage (AWS S3 / Wasabi / MinIO), used when the super admin picks driver S3 or WASABI in IAM
    # Settings -> Storage. Credentials only from this environment; all blank = S3 not configured (uploads with S3
    # chosen are refused with MEDIA_012, never written locally). Endpoint must be https unless its host is listed
    # in allowed-http-hosts (SeaweedFS in the compose network).
    s3:
      endpoint: ${MEDIA_S3_ENDPOINT:}
      region: ${MEDIA_S3_REGION:us-east-1}
      bucket: ${MEDIA_S3_BUCKET:}
      # Secrets: optional feature, so blank (not unset) means "S3 off"; never logged (S3Properties.toString).
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      path-style: ${MEDIA_S3_PATH_STYLE:false}
      prefix: ${MEDIA_S3_PREFIX:}
      create-bucket: ${MEDIA_S3_CREATE_BUCKET:false}
      allowed-http-hosts: ${MEDIA_S3_ALLOWED_HTTP_HOSTS:seaweedfs}
      connect-timeout: ${MEDIA_S3_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${MEDIA_S3_READ_TIMEOUT:PT30S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
