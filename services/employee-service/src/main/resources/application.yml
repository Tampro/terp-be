# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${EMPLOYEE_PORT:8083}

spring:
  application:
    name: employee-service
  datasource:
    url: ${EMPLOYEE_DB_URL:jdbc:mysql://localhost:3306/erp_employee?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${EMPLOYEE_DB_USERNAME}
    password: ${EMPLOYEE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      # Import files only; images and documents go to media-service.
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  employee:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    media-service-url: ${MEDIA_SERVICE_URL:http://localhost:8082}
    # AES key of bank account number and tax payer id (base64 of 32 bytes). Secret: no default.
    enc-key: ${EMPLOYEE_ENC_KEY}
    # Keycloak service account (client credentials): media links of announcement attachments for employees.
    service-account:
      token-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/token
      client-id: ${EMPLOYEE_SERVICE_CLIENT_ID:erp-employee-service}
      # Secret: no default.
      client-secret: ${EMPLOYEE_SERVICE_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
