# Every secret comes from the environment with no default; non-secret values have local defaults.
server:
  port: ${COMMERCE_PORT:8092}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  application:
    name: commerce-service
  datasource:
    url: ${COMMERCE_DB_URL:jdbc:mysql://localhost:3306/erp_commerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${COMMERCE_DB_USERNAME}
    password: ${COMMERCE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: 5s
    # The outbox relay waits for each confirm (RabbitOutboxSender.waitForConfirmsOrDie).
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        # A message whose intake keeps failing is retried in-process, then rejected without requeue, so the queue
        # dead-letters it (erp.commerce.accounting.dlq / erp.accounting.postings.dlq).
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 3
          max-interval: 60s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  # Finance retention (Law on Accounting 2015 Art. 41; PO 2026-11-24): iam.company.anonymize-finance, sent 10 years
  # after the company was deleted → CommerceAnonymizer.
  retention:
    queue: ${ERP_RETENTION_QUEUE:erp.commerce.retention}
    event: iam.company.anonymize-finance
  jobs:
    lock:
      enabled: ${ERP_JOBS_LOCK_ENABLED:true}
  # Transactional outbox (erp-common com.terp.erp.outbox): events are written with the business change and
  # relayed to the erp.events exchange. Off = no relay, and the services that publish fail to start.
  outbox:
    enabled: ${ERP_OUTBOX_ENABLED:true}
    exchange: ${ERP_OUTBOX_EXCHANGE:erp.events}
    batch-size: ${ERP_OUTBOX_BATCH_SIZE:20}
    poll-interval-ms: ${ERP_OUTBOX_POLL_INTERVAL_MS:2000}
    max-attempts: ${ERP_OUTBOX_MAX_ATTEMPTS:10}
    initial-backoff: ${ERP_OUTBOX_INITIAL_BACKOFF:5s}
    max-backoff: ${ERP_OUTBOX_MAX_BACKOFF:10m}
    confirm-timeout: ${ERP_OUTBOX_CONFIRM_TIMEOUT:5s}
  commerce:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8091}
    accounting-service-url: ${ACCOUNTING_SERVICE_URL:http://localhost:8093}
    # Journal results and cleared payments published by accounting-service (bound to erp.events).
    accounting-queue: ${COMMERCE_ACCOUNTING_QUEUE:erp.commerce.accounting}
    accounting-dead-letter-queue: ${COMMERCE_ACCOUNTING_DLQ:erp.commerce.accounting.dlq}
    # Daily accounting.invoice.payment_reminder for overdue posted invoices (PaymentReminderJob, one instance).
    payment-reminder:
      enabled: ${ERP_PAYMENT_REMINDER_ENABLED:true}
      cron: ${ERP_PAYMENT_REMINDER_CRON:0 0 8 * * *}
      zone: ${ERP_PAYMENT_REMINDER_ZONE:Asia/Ho_Chi_Minh}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
