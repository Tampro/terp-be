# No database and no secret: everything is read from the other services with the caller's own token.
server:
  port: ${REPORT_PORT:8090}
  # Finish in-flight requests on SIGTERM (docker stop / rolling restart) instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ERP_SHUTDOWN_TIMEOUT:8s}
  application:
    name: report-service
  messages:
    basename: language/common,language/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:erp}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/erp}

erp:
  report:
    iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
    employee-service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8083}
    attendance-service-url: ${ATTENDANCE_SERVICE_URL:http://localhost:8084}
    recruitment-service-url: ${RECRUITMENT_SERVICE_URL:http://localhost:8085}
    payroll-service-url: ${PAYROLL_SERVICE_URL:http://localhost:8086}
    asset-service-url: ${ASSET_SERVICE_URL:http://localhost:8087}
    meeting-service-url: ${MEETING_SERVICE_URL:http://localhost:8088}
    commerce-service-url: ${COMMERCE_SERVICE_URL:http://localhost:8092}
    crm-service-url: ${CRM_SERVICE_URL:http://localhost:8094}
    project-service-url: ${PROJECT_SERVICE_URL:http://localhost:8095}
    accounting-service-url: ${ACCOUNTING_SERVICE_URL:http://localhost:8093}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8091}
    support-service-url: ${SUPPORT_SERVICE_URL:http://localhost:8096}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
