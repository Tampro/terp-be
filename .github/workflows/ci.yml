# Runs on every PR into main. No E2E here: the live suites (e2e/run.mjs) need the whole ERP stack.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Error Messages en vi ko
        run: node scripts/check-error-messages.mjs

      - name: Check Text Files Are UTF-8
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "::error file=$f::not valid UTF-8"
              bad=1
            fi
          done < <(git ls-files -z -- '*.java' '*.properties' '*.yml' '*.yaml' '*.sql' '*.xml' '*.json' '*.md' '*.mjs' '*.js' '*.html' '*.sh')
          exit $bad

      - name: Build And Unit Tests
        run: mvn -B -ntp package

      - name: Upload Test Reports On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
