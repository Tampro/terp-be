# Runs on every PR into main and on pushes to main: build + unit tests, then a short live E2E run on the whole ERP
# stack (compose, throwaway secrets generated per run).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Error Messages en vi ko
        run: node scripts/check-error-messages.mjs

      - name: Check Text Files Are UTF-8
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "::error file=$f::not valid UTF-8"
              bad=1
            fi
          done < <(git ls-files -z -- '*.java' '*.properties' '*.yml' '*.yaml' '*.sql' '*.xml' '*.json' '*.md' '*.mjs' '*.js' '*.html' '*.sh')
          exit $bad

      - name: Build And Unit Tests
        run: mvn -B -ntp package

      - name: Upload Test Reports On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Throwaway values for this run only: nothing real, nothing stored. Masked so they never show in the log.
      - name: Generate Stack Secrets
        run: |
          put() { echo "::add-mask::$2"; echo "$1=$2" >> "$GITHUB_ENV"; }
          for v in MYSQL_ROOT_PASSWORD KC_DB_PASSWORD KC_BOOTSTRAP_ADMIN_PASSWORD KEYCLOAK_ADMIN_CLIENT_SECRET \
                   ERP_SUPERADMIN_INITIAL_PASSWORD RABBITMQ_PASSWORD MEDIA_LINK_SECRET EMPLOYEE_SERVICE_CLIENT_SECRET \
                   DOCUMENT_SERVICE_CLIENT_SECRET NOTIFICATION_SERVICE_CLIENT_SECRET STORE_SERVICE_CLIENT_SECRET MEMBER_SERVICE_CLIENT_SECRET ORDER_SERVICE_CLIENT_SECRET IAM_DB_PASSWORD MEDIA_DB_PASSWORD \
                   EMPLOYEE_DB_PASSWORD ATTENDANCE_DB_PASSWORD RECRUITMENT_DB_PASSWORD PAYROLL_DB_PASSWORD \
                   ASSET_DB_PASSWORD MEETING_DB_PASSWORD DOCUMENT_DB_PASSWORD INVENTORY_DB_PASSWORD \
                   COMMERCE_DB_PASSWORD ACCOUNTING_DB_PASSWORD CRM_DB_PASSWORD PROJECT_DB_PASSWORD \
                   SUPPORT_DB_PASSWORD NOTIFICATION_DB_PASSWORD STORE_DB_PASSWORD MEMBER_DB_PASSWORD ORDER_DB_PASSWORD SEAWEEDFS_S3_ACCESS_KEY SEAWEEDFS_S3_SECRET_KEY; do
            put "$v" "Ci$(openssl rand -hex 16)"
          done
          for v in EMPLOYEE_ENC_KEY MEETING_ENC_KEY ERP_SETTINGS_ENC_KEY MEMBER_ENC_KEY ORDER_ENC_KEY; do
            put "$v" "$(openssl rand -base64 32)"
          done
          { echo "IAM_DB_USERNAME=erp_iam"; echo "KC_DB_USERNAME=keycloak"; echo "KC_BOOTSTRAP_ADMIN_USERNAME=kcadmin"
            echo "RABBITMQ_USER=erp"; } >> "$GITHUB_ENV"

      - name: Build Jars
        run: mvn -B -ntp -DskipTests package

      - name: Start ERP Stack
        run: |
          # git does not record the executable bit for these here; without it the MySQL entrypoint sources the
          # script instead of running it, and its `set -u` then breaks the entrypoint (MYSQL_ONETIME_PASSWORD)
          chmod +x deploy/mysql/init/*.sh
          docker compose -p erp up -d --build --quiet-pull

      - name: Wait For Services
        run: |
          ports="18080 18081 $(seq -s ' ' 18082 18100)"
          for i in $(seq 1 90); do
            down=""
            for p in $ports; do curl -sf "http://localhost:$p/actuator/health" > /dev/null || down="$down $p"; done
            curl -sf http://localhost:18180/realms/erp > /dev/null || down="$down keycloak"
            if [ -z "$down" ]; then echo "all up after $((i * 10)) s"; exit 0; fi
            sleep 10
          done
          echo "::error::not healthy after 15 min:$down"; docker compose -p erp ps; exit 1

      - name: Bootstrap Superadmin
        run: node e2e/bootstrap.mjs

      - name: Customer Realm Test Client
        run: node e2e/customer-client.mjs

      - name: E2E Suites
        run: node e2e/run.mjs hrm sales purchase acc sup seat stores customer member cart checkout order-invoice

      - name: Stack Logs On Failure
        if: failure()
        run: docker compose -p erp logs --no-color --timestamps > stack-logs.txt 2>&1 || true

      - name: Upload Stack Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: stack-logs.txt
          retention-days: 7
